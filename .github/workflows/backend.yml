name: backend

on:
  push:
    branches: [main, "test/**", "pr/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一 ref 上只保留最新一次，避免连续推分支时排队堆积
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (offline + coverage gate)
    runs-on: ubuntu-latest
    # 兜底：pytest.ini 里已有 timeout=90，这里再给 job 级上限，防止依赖下载卡死
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # 离线全量：不带 API key 也能全绿（llm 用例自动 skip）。
      # 覆盖率门禁 65%（实测基线 69%），跌破即失败。
      - name: Run offline test suite
        run: python -m pytest -m "not llm" --cov-fail-under=65

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

  # 说明：项目当前没有配置 ruff / flake8（本地与 requirements-dev 均无），
  # 因此本工作流只跑测试。后续接入 linter 时在此加一个 lint job 即可。
