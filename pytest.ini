[pytest]
# 测试发现范围——四层目录：unit / integration / api / e2e
testpaths = tests

# 把项目根目录加入 sys.path，使 `from backend.xxx import ...` 在任意工作目录下都可用
pythonpath = .

# pytest-asyncio：L3 需要 async for 迭代 pipeline.run_pipeline，
# auto 模式免去给每个异步用例手写 @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# marker 分级：
#   pytest -m "not llm"  → 离线全量（CI 用，无 API key 也能全绿）
#   pytest               → 含真实 LLM 的 E2E
markers =
    llm: 需要真实 LLM API key 的测试；无 key 环境请用 -m "not llm" 排除

# 全局兜底超时（pytest-timeout）。
# 为什么必须有：SSE 生成器或后台任务若意外不终止，TestClient 会一直阻塞在
# 读响应体上（实测过 300s 挂死，而测试内部任何"deadline 检查"都执行不到）。
# 这里把「挂死」压成「失败」，避免 CI job 一路挂到 6 小时上限。
timeout = 90
timeout_method = thread

addopts = -q
